kind = "web"
previewPath = "/"
title = "Seesaw Productions"
description = "Cinematic production company portfolio for SeeSaw Productions in Karachi, using its existing company information with a Rainfall-inspired film-first presentation."
version = "1.0.0"
id = "artifacts/seesaw-productions"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21552

[services.development]
run = "pnpm --filter @workspace/seesaw-productions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seesaw-productions", "run", "build" ]
serve = "static"
publicDir = "artifacts/seesaw-productions/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21552"
BASE_PATH = "/"
